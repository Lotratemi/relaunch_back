databases:
  - name: relaunch-db
    plan: basic-256mb
    region: frankfurt          # EU region — keep app + DB co-located for low latency
    postgresMajorVersion: "16"

services:
  - type: web
    name: relaunch-back
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt          # MUST match the database region (same zone = minimal latency)
    healthCheckPath: /metrics
    envVars:
      # Database connection — injected automatically from the managed Postgres above.
      - key: DB_HOST
        fromDatabase:
          name: relaunch-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: relaunch-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: relaunch-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: relaunch-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: relaunch-db
          property: password
      # Mistral secrets — set their values in the Render dashboard.
      - key: MISTRAL_API_URL
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_AI_MODEL
        sync: false
