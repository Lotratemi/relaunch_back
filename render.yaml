services:
  - type: web
    name: relaunch-back
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /metrics
    # Secrets are NOT committed — set their values in the Render dashboard
    # (Environment > Environment Variables) or via `sync: false` prompts.
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: MISTRAL_API_URL
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_AI_MODEL
        sync: false
