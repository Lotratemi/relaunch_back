name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build
      run: ./gradlew build -x test

    # The `test` Gradle task spins up a throwaway postgres:16-alpine container
    # (startTestDb/waitForTestDb) seeded from src/test/resources/init.sql, and
    # reads its connection settings from local.properties via loadLocalProps().
    # These values are local-only and non-secret (they target the disposable
    # container on the runner), so we generate the file in CI.
    - name: Generate local.properties for the test database
      run: |
        cat > local.properties <<'EOF'
        TEST_DB_HOST=localhost
        TEST_DB_PORT=5433
        TEST_DB_NAME=relaunch_test
        TEST_DB_USER=test
        TEST_DB_PASSWORD=test
        TEST_DB_CONTAINER=relaunch_test_db
        EOF

    - name: Test
      run: ./gradlew test
